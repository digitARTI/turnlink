name: Tests and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-helper-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - run: node deploy/diagnose-acl-helper.js
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.22.2', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Synthetic Windows helper invocation matrix
        if: runner.os == 'Windows'
        run: node deploy/diagnose-acl-helper.js
      - name: Compile Windows launcher
        shell: bash
        run: mkdir -p dist && GOOS=windows GOARCH=amd64 go -C launcher build -trimpath -o ../dist/agent-channel-codex.exe .
      - name: Go static analysis
        shell: bash
        run: GOOS=windows GOARCH=amd64 go -C launcher vet ./...
      - run: npm test
      - name: Windows ACL helper diagnostics
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP ('turnlink-acl-diagnostic-' + [Guid]::NewGuid())
          New-Item -ItemType Directory -Path $path | Out-Null
          try {
            & ./src/windows-permissions.ps1 -Path $path -Created true
            node -e "const cp=require('node:child_process'),path=require('node:path'); try { cp.execFileSync(path.join(process.env.SystemRoot||'C:\\Windows','System32','WindowsPowerShell','v1.0','powershell.exe'), ['-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',path.resolve('src/windows-permissions.ps1'),'-Path',process.argv[1],'-Created','true'], {stdio:'inherit'}); } catch(e) {console.log('Synthetic helper status:',e.status,e.code);process.exitCode=1;}" $path
          } finally {
            Remove-Item -LiteralPath $path -Recurse -Force
          }
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
