<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Turnlink</title>
  <desc id="description">OpenCode, Codex and Claude Code connect through one channel. Send a task and wake the recipient's existing conversation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2c"/>
      <stop offset="1" stop-color="#090f19"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3bf" stop-opacity=".2"/>
      <stop offset="1" stop-color="#66e3bf" stop-opacity=".85"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#263449"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)" opacity=".55"/>
  <rect x="48" y="45" width="214" height="27" rx="13.5" fill="#66e3bf" fill-opacity=".09" stroke="#66e3bf" stroke-opacity=".35"/>
  <circle cx="63" cy="58.5" r="3" fill="#66e3bf"/>
  <text x="76" y="62.5" fill="#9aefd4" font-family="monospace" font-size="11" letter-spacing="1.1">HARNESS-AWARE MESSAGING</text>
  <g transform="translate(47 92) scale(.42)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <path d="M82 36H64C46 36 32 50 32 68s14 32 32 32h14" stroke="#66e3bf"/>
    <path d="M78 124h18c18 0 32-14 32-32S114 60 96 60H82" stroke="#8eb5ff"/>
    <path d="M65 80h30" stroke="#eef5ff" stroke-width="9"/>
    <circle cx="94" cy="36" r="6" fill="#e9bd70" stroke="none"/>
  </g>
  <text x="127" y="150" fill="#f1f5fa" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Turnlink</text>
  <text x="50" y="193" fill="#a8b8cd" font-family="Arial, Helvetica, sans-serif" font-size="23">Your agents. One channel.</text>
  <text x="50" y="237" fill="#8497b0" font-family="Arial, Helvetica, sans-serif" font-size="16">Send a task. Wake the existing conversation.</text>
  <text x="50" y="262" fill="#8497b0" font-family="Arial, Helvetica, sans-serif" font-size="16">Connect across harnesses and hosts.</text>
  <rect x="49" y="311" width="230" height="35" rx="8" fill="#142236" stroke="#2b3d54"/>
  <text x="65" y="333" fill="#c4d1e2" font-family="monospace" font-size="13">ws://127.0.0.1:47321</text>
  <text x="301" y="333" fill="#60758f" font-family="monospace" font-size="12">LOCAL FIRST / SSH REMOTE</text>
  <path d="M774 104 H834 Q866 104 866 136 V171 M774 205 H813 M774 306 H834 Q866 306 866 274 V239" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M928 205 H963" fill="none" stroke="#66e3bf" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="618" y="68" width="156" height="72" rx="12" fill="#142236" stroke="#30455d"/>
    <circle cx="639" cy="94" r="4" fill="#66e3bf"/>
    <text x="653" y="99" fill="#e3ebf5" font-size="17" font-weight="600">OpenCode</text>
    <text x="639" y="122" fill="#859ab5" font-size="11">PLUGIN + SESSION API</text>
    <rect x="618" y="169" width="156" height="72" rx="12" fill="#142236" stroke="#30455d"/>
    <circle cx="639" cy="195" r="4" fill="#66e3bf"/>
    <text x="653" y="200" fill="#e3ebf5" font-size="17" font-weight="600">Codex</text>
    <text x="639" y="223" fill="#859ab5" font-size="11">APP-SERVER PROXY</text>
    <rect x="618" y="270" width="156" height="72" rx="12" fill="#142236" stroke="#30455d"/>
    <circle cx="639" cy="296" r="4" fill="#66e3bf"/>
    <text x="653" y="301" fill="#e3ebf5" font-size="17" font-weight="600">Claude Code</text>
    <text x="639" y="324" fill="#859ab5" font-size="11">NATIVE CHANNELS</text>
    <circle cx="871" cy="205" r="57" fill="#66e3bf" fill-opacity=".045" stroke="#66e3bf" stroke-opacity=".2"/>
    <circle cx="871" cy="205" r="42" fill="#112c2c" stroke="#66e3bf" stroke-opacity=".75"/>
    <text x="871" y="202" text-anchor="middle" fill="#adf5dd" font-size="12" font-weight="700">SHARED</text>
    <text x="871" y="219" text-anchor="middle" fill="#adf5dd" font-size="12" font-weight="700">BROKER</text>
    <rect x="963" y="169" width="186" height="72" rx="12" fill="#152431" stroke="#4a6b74"/>
    <text x="982" y="199" fill="#e3ebf5" font-size="16" font-weight="600">Remote agent</text>
    <text x="982" y="222" fill="#8fb7bd" font-size="11">SSH + LOCAL ADAPTER</text>
    <text x="869" y="366" text-anchor="middle" fill="#7288a3" font-family="monospace" font-size="11">DIRECT MESSAGES / BROADCAST / IDLE WAKE</text>
  </g>
</svg>
